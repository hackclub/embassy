services:
  postgres:
    image: postgres:16-alpine
    container_name: whoami-postgres
    environment:
      POSTGRES_USER: whoami
      POSTGRES_DB: whoami
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoami -d whoami"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - whoami-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: whoami-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - whoami-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  whoami:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whoami-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      AUTH_URL: https://lucky-badger-82.k.hackclub.dev
      REDIS_URL: redis://whoami-redis:6379
    command: >
      sh -c "bun node_modules/prisma/build/index.js migrate deploy &&
             exec bun server.js"
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - whoami-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  postgres-data:
  redis-data:

networks:
  whoami-network:
    driver: bridge
